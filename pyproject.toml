[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "composer-upgrade"
version = "0.1.0"
description = "Interactive Composer dependency upgrade assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "composer-upgrade contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["textual>=0.85"]

[project.urls]
Documentation = "https://github.com/marc31/composer-upgrade#readme"
Repository = "https://github.com/marc31/composer-upgrade"
Issues = "https://github.com/marc31/composer-upgrade/issues"

[project.scripts]
composer-upgrade = "composer_upgrade.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/composer_upgrade"]
